# Enable only after a certificate exists for portfolio.72945645.xyz.
# This is a separate virtual host; Media Workspace continues to listen on 8088.
server {
    listen 80;
    listen [::]:80;
    server_name portfolio.72945645.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/portfolio-acme;
        default_type text/plain;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name portfolio.72945645.xyz;
    ssl_certificate /etc/letsencrypt/live/portfolio.72945645.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portfolio.72945645.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /api/resume {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18105/api/resume;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_buffering off;
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }
    location ^~ /api/ { return 404; }

    include /etc/nginx/project-index-route.conf;
    include /etc/nginx/project-apps-route.conf;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
