server {
    listen 80;
    listen [::]:80;
    server_name portfolio.72945645.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/portfolio-acme;
        default_type text/plain;
    }

    location / {
        default_type text/plain;
        return 200 "Portfolio HTTPS setup in progress.\n";
    }
}
