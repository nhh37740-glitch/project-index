# Included inside the existing Media Workspace server block on port 8088.
# These routes preserve the application path with a URI prefix, while keeping
# all service containers reachable only on host loopback.

location = /projects/radar { return 308 /projects/radar/; }
location ^~ /projects/radar/ {
    proxy_pass http://127.0.0.1:18104/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location = /projects/apps/go { return 308 /projects/apps/go/; }
location ^~ /projects/apps/go/ {
    proxy_pass http://127.0.0.1:18101/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 360s;

    # The Go UI uses root-absolute routes. Rebase its links and fetch/EventSource
    # URLs so they stay under this app prefix and cannot fall into Media routes.
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter '/api/' '/projects/apps/go/api/';
    sub_filter 'href="/harness"' 'href="/projects/apps/go/harness"';
    sub_filter 'href="/council"' 'href="/projects/apps/go/council"';
    sub_filter 'href="/"' 'href="/projects/apps/go/"';
}

location = /projects/apps/java { return 308 /projects/apps/java/; }
location ^~ /projects/apps/java/ {
    proxy_pass http://127.0.0.1:18102/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 360s;

}

location = /projects/apps/cpp { return 308 /projects/apps/cpp/; }
location ^~ /projects/apps/cpp/ {
    proxy_pass http://127.0.0.1:18103/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 30s;

    # Rebase dashboard fetches and returned frame URLs beneath this prefix.
    proxy_set_header Accept-Encoding "";
    sub_filter_types text/html application/json;
    sub_filter_once off;
    sub_filter '/api/state' '/projects/apps/cpp/api/state';
    sub_filter '"/frame/' '"/projects/apps/cpp/frame/';
}
